
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Foods</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        .food-image {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        .container {
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            🍔 Food Ordering
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="addFood.html">Add Food</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

        <h1>Food List</h1>

        <input
            type="text"
            id="search"
            placeholder="Search Food Name..."
            onkeyup="searchFood()">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Food Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Available</th>
                    <th>Image</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="foodTable">

            </tbody>

        </table>

    </div>

    <footer>
        <p>
            © 2026 Food Ordering Management System
        </p>
    </footer>

    <script src="viewfood.js"></script>

</body>
</html>
