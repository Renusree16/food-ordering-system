<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
🍔 Food Dashboard
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="addfood.html">Add Food</a></li>

<li><a href="viewfood.html">View Food</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>

</nav>

<h1 class="heading">Dashboard</h1>

<div class="dashboard">

<div class="box total">
<h2>Total Foods</h2>
<h1 id="total">0</h1>
</div>

<div class="box veg">
<h2>Veg Foods</h2>
<h1 id="veg">0</h1>
</div>

<div class="box nonveg">
<h2>Non Veg Foods</h2>
<h1 id="nonveg">0</h1>
</div>

<div class="box available">
<h2>Available</h2>
<h1 id="available">0</h1>
</div>

<div class="box unavailable">
<h2>Unavailable</h2>
<h1 id="unavailable">0</h1>
</div>

</div>

<div class="filter-section">

<input type="text"
id="searchBox"
placeholder="Search Food..."
onkeyup="searchFood()">

<select id="categoryFilter" onchange="filterCategory()">

<option value="All">All Categories</option>
<option value="Veg">Veg</option>
<option value="Non Veg">Non Veg</option>

</select>

</div>

<div class="btn-area">

<a href="addfood.html">
<button>Add Food</button>
</a>

<a href="viewfood.html">
<button>View Foods</button>
</a>

</div>

<h2 class="heading">Food List</h2>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Description</th>
<th>Available</th>

</tr>

</thead>

<tbody id="foodTable">

</tbody>

</table>

<script src="dashboard.js"></script>
<footer>

<p>

© 2026 Food Ordering Management System

</p>

</footer>
</body>

</html>
